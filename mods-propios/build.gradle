plugins {
    id "base"
}

gradle.projectsEvaluated {
    tasks.named("build") {
        dependsOn subprojects.collect { project ->
            project.tasks.named("build")
        }
    }
}

subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 17
    }
}
