plugins {
    id 'fabric-loom' version '1.6.12' apply false
}

allprojects {
    group = 'com.mardenuves'
    version = '1.0.0'
}

subprojects {
    apply plugin: 'fabric-loom'

    repositories {
        mavenCentral()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
    }
}