name: Build modpack

on:
  push:
    branches:
      - etapa-7-modpack
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The supplied pack targets Minecraft 1.20.1, so Java 17 is used.
      # If the manifest changes, update this step to Java 21 for MC >= 1.20.5.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Mods own build files specify Fabric Loom 1.6.12.
          # Loom 1.6 needs Gradle 8.7 or newer; use the latest verified 8.x.
          gradle-version: '8.14.8'
          cache-provider: basic

      - name: Build own mods when the multi-project build exists
        shell: bash
        run: |
          if [ -f mods-propios/settings.gradle ]; then
            gradle build --stacktrace
          else
            echo "mods-propios/settings.gradle not found; skipping own-mod compilation."
          fi
        working-directory: .

      - name: Build distribution packages
        run: |
          python3 scripts/build_tlauncher.py
          python3 scripts/build_mrpack.py

      - name: Upload TLauncher ZIP
        uses: actions/upload-artifact@v7
        with:
          name: tlauncher-package
          path: dist/*-tlauncher.zip
          if-no-files-found: error

      - name: Upload Modrinth package
        uses: actions/upload-artifact@v7
        with:
          name: mrpack-package
          path: dist/*.mrpack
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Modpack build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*-tlauncher.zip
            dist/*.mrpack
          fail_on_unmatched_files: true
          generate_release_notes: true
