name: Build modpack

on:
  push:
    branches:
      - etapa-7-modpack
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Leer versiones del paquete
        id: pack
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("pack/mods.json")
          if not path.is_file():
              raise SystemExit(f"Falta el manifiesto requerido: {path}")
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              raise SystemExit(f"No se pudo leer {path}: {exc}")
          if not isinstance(data, dict):
              raise SystemExit(f"El manifiesto {path} debe ser un objeto JSON")

          mc = data.get("minecraft_version") or data.get("game_version")
          if not isinstance(mc, str) or not mc.strip():
              raise SystemExit("Falta minecraft_version (o game_version) en pack/mods.json")

          version = 17 if tuple(int(x) for x in mc.strip().split(".")[:2]) <= (1, 20) and mc.strip() != "1.20.5" else 21
          # En Minecraft 1.20.5+ se requiere Java 21; las versiones hasta 1.20.4 usan Java 17.
          parts = tuple(int(x) for x in mc.strip().split(".")[:3])
          if parts[:2] == (1, 20) and len(parts) >= 3:
              version = 17 if parts[2] <= 4 else 21
          elif parts[0] == 1 and parts[1] < 20:
              version = 17
          elif parts[0] == 1 and parts[1] == 20:
              version = 17 if len(parts) < 3 or parts[2] <= 4 else 21
          else:
              version = 21

          with open(Path(__import__("os").environ["GITHUB_OUTPUT"]), "a", encoding="utf-8") as out:
              out.write(f"java={version}\n")

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.pack.outputs.java }}

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Loom 1.6.12 y la compatibilidad exacta del conjunto no se probaron aquí.
          # Gradle 8.7 es la base conservadora documentada para Loom 1.6.
          gradle-version: '8.7'

      - name: Compilar mods propios
        shell: bash
        run: |
          if [ -f mods-propios/settings.gradle ]; then
            cd mods-propios
            gradle build --stacktrace
          else
            echo "No existe mods-propios/settings.gradle; se omite la compilacion de mods propios."
          fi

      - name: Construir paquetes
        run: |
          python3 scripts/build_tlauncher.py
          python3 scripts/build_mrpack.py

      - name: Subir artefactos TLauncher y mrpack
        uses: actions/upload-artifact@v7
        with:
          name: modpack-installers
          path: |
            dist/*-tlauncher.zip
            dist/*.mrpack
          if-no-files-found: error

      - name: Crear Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-tlauncher.zip
            dist/*.mrpack
          fail_on_unmatched_files: true
