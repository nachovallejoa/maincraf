name: Build modpack packages

on:
  push:
    branches:
      - etapa-7-modpack
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
          cache-provider: basic

      - name: Build own mods
        shell: bash
        run: |
          if [ -f mods-propios/settings.gradle ]; then
            cd mods-propios
            gradle build --stacktrace
          else
            echo "ERROR: no existe mods-propios/settings.gradle"
            exit 1
          fi

      - name: Build TLauncher and mrpack packages
        run: |
          python3 scripts/build_tlauncher.py
          python3 scripts/build_mrpack.py

      - name: Upload TLauncher ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: tlauncher-package
          path: dist/*-tlauncher.zip
          if-no-files-found: error

      - name: Upload mrpack artifact
        uses: actions/upload-artifact@v7
        with:
          name: mrpack-package
          path: dist/*.mrpack
          if-no-files-found: error

      - name: Publish Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/etapa-7-modpack'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          tlauncher=(dist/*-tlauncher.zip)
          mrpack=(dist/*.mrpack)
          if [ "${#tlauncher[@]}" -ne 1 ] || [ "${#mrpack[@]}" -ne 1 ]; then
            echo "ERROR: se esperaba exactamente un ZIP TLauncher y un mrpack."
            exit 1
          fi
          tag="modpack-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "${tlauncher[0]}" "${mrpack[0]}" \
            --title "Paquete del modpack ${GITHUB_RUN_NUMBER}" \
            --notes "Paquetes TLauncher y mrpack; consultar INSTALL.md y las advertencias de verificación."
