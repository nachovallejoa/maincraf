name: Build Modpack

on:
  push:
    branches:
      - etapa-7-modpack
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read modpack metadata
        id: pack
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("pack/mods.json").read_text(encoding="utf-8"))
          minecraft = manifest["minecraft_version"]
          major, minor, patch = (int(part) for part in minecraft.split("."))
          java = "17" if (major, minor, patch) <= (1, 20, 4) else "21"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"java={java}\n")

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.pack.outputs.java }}

      - name: Check Loom version and configure Gradle
        if: ${{ hashFiles('mods-propios/settings.gradle') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          files=(mods-propios/settings.gradle mods-propios/build.gradle)
          found="$(grep -hEo "fabric-loom[^[:space:]]*[[:space:]]+version[[:space:]]+['\"][^'\"]+['\"]|fabric-loom[^[:space:]]*:[^[:space:]'\"]+" "${files[@]}" 2>/dev/null | head -n 1 || true)"
          if [[ -z "$found" ]]; then
            echo "::error::No se pudo identificar la versión de Fabric Loom en mods-propios/settings.gradle o build.gradle; no es seguro fijar Gradle sin ese dato."
            exit 1
          fi
          echo "Declaración de Loom detectada: $found"
          if [[ "$found" != *"1.6"* ]]; then
            echo "::error::Este workflow configura Gradle 8.7, documentado para Loom 1.6. Ajusta gradle-version al requisito de la versión de Loom detectada."
            exit 1
          fi

      - name: Set up Gradle
        if: ${{ hashFiles('mods-propios/settings.gradle') != '' }}
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build own mods
        if: ${{ hashFiles('mods-propios/settings.gradle') != '' }}
        run: gradle build
        working-directory: mods-propios

      - name: Build Modrinth pack
        run: python3 scripts/build_mrpack.py

      - name: Upload .mrpack artifact
        uses: actions/upload-artifact@v7
        with:
          name: mrpack
          path: '*.mrpack'
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: modpack-${{ github.run_number }}
          name: Modpack build ${{ github.run_number }}
          files: '*.mrpack'
          fail_on_unmatched_files: true
          make_latest: false
