name: Build modpack

on:
  push:
    branches:
      - etapa-7-modpack
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Leer version de Minecraft
        id: pack
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          path = Path("pack/mods.json")
          if not path.is_file():
              raise SystemExit(f"ERROR: falta el manifiesto {path}")
          data = json.loads(path.read_text(encoding="utf-8"))
          version = data.get("minecraft_version") or data.get("game_version")
          if not isinstance(version, str) or not version.strip():
              raise SystemExit("ERROR: falta minecraft_version (o game_version) no vacia en pack/mods.json")
          version = version.strip()
          parts = version.split(".")
          try:
              major, minor, patch = (int(parts[0]), int(parts[1]), int(parts[2].split("-")[0]))
          except (ValueError, IndexError):
              raise SystemExit(f"ERROR: version Minecraft no reconocida: {version}")
          java = "21" if (major, minor, patch) >= (1, 20, 5) else "17"
          print(f"java={java}")
          PY

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.pack.outputs.java }}

      # Loom de los mods propios no se entrego en la entrada para inspeccion.
      # [SIN VERIFICAR] Se usa Gradle 8.10.2 como fallback conservador solicitado.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-provider: basic

      - name: Compilar mods propios si hay settings.gradle
        shell: bash
        run: |
          if [ -f "mods-propios/settings.gradle" ] || [ -f "mods-propios/settings.gradle.kts" ]; then
            cd mods-propios
            gradle build --stacktrace
          else
            echo "No hay mods-propios/settings.gradle; se omite la compilacion."
          fi

      - name: Construir paquetes
        run: |
          python3 scripts/build_tlauncher.py
          python3 scripts/build_mrpack.py

      - name: Subir artefactos
        uses: actions/upload-artifact@v7
        with:
          name: modpack-dist
          path: |
            dist/*-tlauncher.zip
            dist/*.mrpack
          if-no-files-found: error

      - name: Publicar Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: modpack-${{ github.run_number }}
          name: Mar de Nubes build ${{ github.run_number }}
          files: |
            dist/*-tlauncher.zip
            dist/*.mrpack
          fail_on_unmatched_files: true
          generate_release_notes: true
